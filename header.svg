<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="260" viewBox="0 0 900 260" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#060C18" />
    </linearGradient>

    <!-- Animated Accent Laser Gradient -->
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF94" />
      <stop offset="35%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#00FF94" />
    </linearGradient>

    <!-- Glowing Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FF94" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="85%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#00FF94" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-emerald" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00FF94" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#00FF94" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </radialGradient>

    <!-- Cyber Tech Grid Pattern -->
    <pattern id="cyber-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45" />
      <circle cx="28" cy="28" r="0.8" fill="#00FF94" fill-opacity="0.2" />
    </pattern>

    <!-- Filter for Neon Glow -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 6px rgba(0, 255, 148, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.7)); }
    }
    @keyframes radarPing {
      0% { r: 3.5px; opacity: 1; }
      75% { r: 12px; opacity: 0; }
      100% { r: 14px; opacity: 0; }
    }
    @keyframes laserRun {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -1200; }
    }
    @keyframes scanline {
      0% { transform: translateY(-50px); opacity: 0; }
      15% { opacity: 0.6; }
      85% { opacity: 0.6; }
      100% { transform: translateY(260px); opacity: 0; }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', 'Fira Code', monospace;
      font-weight: 900;
      letter-spacing: 7px;
      font-size: 44px;
      fill: url(#title-grad);
      animation: pulseGlow 4s ease-in-out infinite;
    }
    .tagline-badge {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 2.5px;
      fill: #00FF94;
    }
    .sub-role {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      letter-spacing: 2px;
      font-size: 15px;
      fill: #CBD5E1;
    }
    .tech-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #E2E8F0;
      letter-spacing: 0.5px;
    }
    .hud-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      fill: #64748B;
    }
    .status-text {
      font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #00FF94;
    }
    .laser-border {
      stroke-dasharray: 120 180;
      animation: laserRun 10s linear infinite;
    }
    .beacon-pulse {
      animation: radarPing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .scanner-beam {
      animation: scanline 7s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="900" height="260" rx="16" fill="url(#bg-grad)" />
  <rect width="900" height="260" rx="16" fill="url(#cyber-grid)" />

  <!-- Dynamic Radial Glow Fields -->
  <rect width="900" height="260" rx="16" fill="url(#glow-emerald)" />
  <rect width="900" height="260" rx="16" fill="url(#glow-cyan)" />

  <!-- Animated Scanner Light Beam -->
  <g class="scanner-beam">
    <line x1="20" y1="0" x2="880" y2="0" stroke="url(#laser-grad)" stroke-width="1.2" opacity="0.4" />
  </g>

  <!-- Base Border -->
  <rect x="1" y="1" width="898" height="258" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Animated Laser Beam Border -->
  <rect x="1" y="1" width="898" height="258" rx="15" fill="none" stroke="url(#laser-grad)" stroke-width="2" class="laser-border" filter="url(#neon-glow)" />

  <!-- HUD Corner Accents -->
  <path d="M 22 36 L 22 22 L 36 22" stroke="#00FF94" stroke-width="2.5" fill="none" />
  <path d="M 878 36 L 878 22 L 864 22" stroke="#00D2FF" stroke-width="2.5" fill="none" />
  <path d="M 22 224 L 22 238 L 36 238" stroke="#00FF94" stroke-width="2.5" fill="none" />
  <path d="M 878 224 L 878 238 L 864 238" stroke="#00D2FF" stroke-width="2.5" fill="none" />

  <!-- Top Left Terminal Title Bar -->
  <g transform="translate(36, 26)">
    <circle cx="0" cy="0" r="4.5" fill="#EF4444" opacity="0.85" />
    <circle cx="14" cy="0" r="4.5" fill="#F59E0B" opacity="0.85" />
    <circle cx="28" cy="0" r="4.5" fill="#10B981" opacity="0.85" />
    <text x="46" y="3.5" class="hud-meta">ID: YB_CORE // SYS_V2026.4 // ETHIOPIA 🇪🇹</text>
  </g>

  <!-- Top Right Live Status Beacon Pill -->
  <g transform="translate(672, 18)">
    <rect width="192" height="26" rx="13" fill="#0B1322" stroke="#00FF94" stroke-width="1" stroke-opacity="0.5" />
    <!-- Radar ping ripple -->
    <circle cx="18" cy="13" r="3.5" fill="none" stroke="#00FF94" stroke-width="1.5" class="beacon-pulse" />
    <!-- Solid beacon center -->
    <circle cx="18" cy="13" r="3.5" fill="#00FF94" />
    <text x="32" y="16.5" class="status-text">AVAILABLE FOR WORK</text>
  </g>

  <!-- Center HUD Geometry Icons -->
  <text x="56" y="142" font-family="'JetBrains Mono', monospace" font-size="46" fill="#00FF94" opacity="0.12">&lt;/&gt;</text>
  <text x="806" y="142" font-family="'JetBrains Mono', monospace" font-size="46" fill="#00D2FF" opacity="0.12">{ ; }</text>

  <!-- Main Center Branding -->
  <g text-anchor="middle" transform="translate(450, 0)">
    <!-- Tech Eyebrow Tag -->
    <g transform="translate(0, 78)">
      <rect x="-190" y="-14" width="380" height="22" rx="11" fill="#0B1726" stroke="#1E3A5F" stroke-width="1" />
      <text y="1.5" class="tagline-badge">⚡ FULL-STACK ARCHITECT &amp; MOBILE DEV ⚡</text>
    </g>

    <!-- Main Name Title -->
    <text y="130" class="title-text">YIHUNE BELAY</text>

    <!-- Subtitle Definition -->
    <text y="166" class="sub-role">Engineering Production Web Platforms &amp; Scalable Mobile Applications</text>

    <!-- Modern Interactive Tech Stack Pills -->
    <g transform="translate(-355, 196)">
      <!-- 1. React & Next.js -->
      <g transform="translate(0, 0)">
        <rect width="105" height="26" rx="7" fill="#0D1629" stroke="#1E293B" stroke-width="1" />
        <circle cx="14" cy="13" r="3" fill="#61DAFB" />
        <text x="24" y="17" class="tech-pill">Next.js / React</text>
      </g>
      <!-- 2. React Native -->
      <g transform="translate(115, 0)">
        <rect width="105" height="26" rx="7" fill="#0D1629" stroke="#1E293B" stroke-width="1" />
        <circle cx="14" cy="13" r="3" fill="#00D2FF" />
        <text x="24" y="17" class="tech-pill">React Native</text>
      </g>
      <!-- 3. TypeScript -->
      <g transform="translate(230, 0)">
        <rect width="98" height="26" rx="7" fill="#0D1629" stroke="#1E293B" stroke-width="1" />
        <circle cx="14" cy="13" r="3" fill="#3178C6" />
        <text x="24" y="17" class="tech-pill">TypeScript</text>
      </g>
      <!-- 4. NestJS & Node -->
      <g transform="translate(338, 0)">
        <rect width="112" height="26" rx="7" fill="#0D1629" stroke="#1E293B" stroke-width="1" />
        <circle cx="14" cy="13" r="3" fill="#E0234E" />
        <text x="24" y="17" class="tech-pill">NestJS / Node</text>
      </g>
      <!-- 5. Django / Python -->
      <g transform="translate(460, 0)">
        <rect width="122" height="26" rx="7" fill="#0D1629" stroke="#1E293B" stroke-width="1" />
        <circle cx="14" cy="13" r="3" fill="#00FF94" />
        <text x="24" y="17" class="tech-pill">Django REST / Py</text>
      </g>
      <!-- 6. PostgreSQL -->
      <g transform="translate(592, 0)">
        <rect width="118" height="26" rx="7" fill="#0D1629" stroke="#1E293B" stroke-width="1" />
        <circle cx="14" cy="13" r="3" fill="#336791" />
        <text x="24" y="17" class="tech-pill">PostgreSQL / ORM</text>
      </g>
    </g>
  </g>

  <!-- Bottom Coordinates Meta -->
  <text x="36" y="244" class="hud-meta">LAT: 9.0300° N · LON: 38.7400° E (EAT / UTC+3)</text>
  <text x="864" y="244" text-anchor="end" class="hud-meta">SECURITY: STRICT · TYPE-SAFE · MODULAR</text>
</svg>
