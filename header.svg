<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <rect width="900" height="220" fill="#0A0E1A"/>

  <rect width="900" height="3" y="0" fill="#00FF94"/>
  <rect width="900" height="3" y="217" fill="#00BFFF"/>

  <!-- Decorative dots -->
  <g fill="#00FF94" opacity="0.2">
    <circle cx="50" cy="40" r="2"/>
    <circle cx="100" cy="40" r="2"/>
    <circle cx="150" cy="40" r="2"/>
    <circle cx="200" cy="40" r="2"/>
    <circle cx="700" cy="40" r="2"/>
    <circle cx="750" cy="40" r="2"/>
    <circle cx="800" cy="40" r="2"/>
    <circle cx="850" cy="40" r="2"/>

    <circle cx="50" cy="180" r="2"/>
    <circle cx="100" cy="180" r="2"/>
    <circle cx="150" cy="180" r="2"/>
    <circle cx="750" cy="180" r="2"/>
    <circle cx="800" cy="180" r="2"/>
    <circle cx="850" cy="180" r="2"/>
  </g>

  <!-- Circuit lines -->
  <g fill="none" stroke="#00FF94" stroke-width="1" opacity="0.3">
    <polyline points="0,55 80,55 80,95 140,95"/>
    <polyline points="0,95 40,95 40,130 0,130"/>
    <polyline points="0,160 60,160 60,140 120,140"/>
  </g>

  <g fill="none" stroke="#00BFFF" stroke-width="1" opacity="0.3">
    <polyline points="900,55 820,55 820,95 760,95"/>
    <polyline points="900,95 860,95 860,130 900,130"/>
    <polyline points="900,160 840,160 840,140 780,140"/>
  </g>

  <!-- Corner decorations -->
  <g fill="none" stroke="#00FF94" stroke-width="2" opacity="0.5">
    <polyline points="16,16 16,30 30,30"/>
    <polyline points="884,16 870,16 870,30"/>
    <polyline points="16,204 16,190 30,190"/>
    <polyline points="884,204 870,204 870,190"/>
  </g>

  <!-- Center indicator -->
  <circle cx="450" cy="25" r="3" fill="#00FF94"/>
  <circle cx="430" cy="25" r="2" fill="#00FF94" opacity="0.4"/>
  <circle cx="470" cy="25" r="2" fill="#00FF94" opacity="0.4"/>

  <!-- Brackets -->
  <text
    x="50"
    y="125"
    font-family="monospace"
    font-size="50"
    fill="#00FF94"
    opacity="0.2"
  >{</text>

  <text
    x="850"
    y="125"
    font-family="monospace"
    font-size="50"
    fill="#00FF94"
    opacity="0.2"
  >}</text>

  <!-- Name -->
  <text
    x="450"
    y="115"
    text-anchor="middle"
    font-family="monospace"
    font-size="52"
    font-weight="bold"
    letter-spacing="6"
    fill="#00FF94"
  >YIHUNE BELAY</text>

  <!-- Subtitle -->
  <text
    x="450"
    y="150"
    text-anchor="middle"
    font-family="monospace"
    font-size="16"
    letter-spacing="2"
    fill="#FFFFFF"
  >Full-Stack Web &amp; Mobile Developer</text>

  <!-- Tech stack -->
  <text
    x="450"
    y="177"
    text-anchor="middle"
    font-family="monospace"
    font-size="11"
    letter-spacing="2"
    fill="#00BFFF"
  >React · React Native · Django · Laravel · Node.js</text>

  <!-- Bottom waves -->
  <path
    d="M0 195 Q225 180 450 200 Q675 220 900 195"
    fill="none"
    stroke="#00FF94"
    stroke-width="1"
    opacity="0.25"
  />
</svg>
