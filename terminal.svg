<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="330" viewBox="0 0 860 330" fill="none">
  <defs>
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#0C1322" />
    </linearGradient>

    <linearGradient id="header-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#141E34" />
    </linearGradient>

    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF94" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .term-font {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;
      font-size: 13px;
    }
    .prompt-user { fill: #00FF94; font-weight: 700; }
    .prompt-at { fill: #64748B; }
    .prompt-host { fill: #00D2FF; font-weight: 600; }
    .prompt-dir { fill: #FACC15; }
    .prompt-git { fill: #EC4899; font-weight: 600; }
    .cmd-text { fill: #FFFFFF; font-weight: 600; }
    .out-text { fill: #94A3B8; }
    .out-accent { fill: #38BDF8; }
    .out-success { fill: #4ADE80; font-weight: 600; }
    .out-highlight { fill: #FCD34D; }
    .out-string { fill: #A7F3D0; }
    .cursor {
      fill: #00FF94;
      animation: blink 1s step-start infinite;
    }
    .tab-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Window Container -->
  <rect width="860" height="330" rx="12" fill="url(#term-bg)" />
  <rect x="0.75" y="0.75" width="858.5" height="328.5" rx="11.25" fill="none" stroke="url(#border-glow)" stroke-width="1.5" />

  <!-- Terminal Window Top Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 848 0 C 854.627 0 860 5.373 860 12 L 860 38 L 0 38 Z" fill="url(#header-bg)" />
  <line x1="0" y1="38" x2="860" y2="38" stroke="#1E293B" stroke-width="1" />

  <!-- Mac / Unix Window Controls -->
  <circle cx="24" cy="19" r="6" fill="#EF4444" opacity="0.9" />
  <circle cx="44" cy="19" r="6" fill="#F59E0B" opacity="0.9" />
  <circle cx="64" cy="19" r="6" fill="#10B981" opacity="0.9" />

  <!-- Window Title -->
  <g transform="translate(430, 23)" text-anchor="middle">
    <text class="tab-title">⚡ yihune@workstation:~ (zsh) — 80×24</text>
  </g>

  <!-- Right Branch Badge -->
  <g transform="translate(745, 12)">
    <rect width="95" height="16" rx="4" fill="#0B1324" stroke="#1E293B" stroke-width="0.8" />
    <text x="47.5" y="11.5" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#00FF94">git:(main) ✔</text>
  </g>

  <!-- Terminal Content Lines -->
  <g transform="translate(26, 68)" class="term-font">
    
    <!-- Line 1: whoami -->
    <text y="0">
      <tspan class="prompt-user">yihune</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">cloud-node</tspan> <tspan class="prompt-dir">~/dev</tspan> <tspan class="prompt-git">‹main›</tspan> <tspan class="cmd-text">$ whoami</tspan>
    </text>
    <text y="24" class="out-accent">
      ➜ Yihune Belay Sebsibe <tspan class="out-text">— Full-Stack Software Engineer &amp; Mobile Architect 🇪🇹</tspan>
    </text>

    <!-- Line 2: focus / status -->
    <text y="58">
      <tspan class="prompt-user">yihune</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">cloud-node</tspan> <tspan class="prompt-dir">~/dev</tspan> <tspan class="prompt-git">‹main›</tspan> <tspan class="cmd-text">$ cat availability.json</tspan>
    </text>
    <text y="82">
      <tspan class="out-text">{ </tspan><tspan class="out-highlight">"status"</tspan><tspan class="out-text">: </tspan><tspan class="out-string">"Open to Full-Time &amp; High-Impact Roles"</tspan><tspan class="out-text">, </tspan><tspan class="out-highlight">"remote"</tspan><tspan class="out-text">: </tspan><tspan class="out-success">true</tspan><tspan class="out-text">, </tspan><tspan class="out-highlight">"relocate"</tspan><tspan class="out-text">: </tspan><tspan class="out-success">true</tspan><tspan class="out-text"> }</tspan>
    </text>

    <!-- Line 3: execution / capabilities -->
    <text y="116">
      <tspan class="prompt-user">yihune</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">cloud-node</tspan> <tspan class="prompt-dir">~/dev</tspan> <tspan class="prompt-git">‹main›</tspan> <tspan class="cmd-text">$ ./check_core_stack.sh --summary</tspan>
    </text>
    <text y="140">
      <tspan class="out-success">[✔] WEB:</tspan> <tspan class="out-text">Next.js 15, React, TypeScript, Tailwind CSS</tspan>
    </text>
    <text y="162">
      <tspan class="out-success">[✔] MOBILE:</tspan> <tspan class="out-text">React Native, Expo, Android &amp; iOS Native Builds</tspan>
    </text>
    <text y="184">
      <tspan class="out-success">[✔] BACKEND:</tspan> <tspan class="out-text">NestJS Clean Architecture, Django REST, Node.js, Laravel</tspan>
    </text>
    <text y="206">
      <tspan class="out-success">[✔] DATA:</tspan> <tspan class="out-text">PostgreSQL, Prisma ORM, MySQL, MongoDB, Redis</tspan>
    </text>

    <!-- Line 4: prompt with blinking cursor -->
    <text y="240">
      <tspan class="prompt-user">yihune</tspan><tspan class="prompt-at">@</tspan><tspan class="prompt-host">cloud-node</tspan> <tspan class="prompt-dir">~/dev</tspan> <tspan class="prompt-git">‹main›</tspan> <tspan class="cmd-text">$ ./build_future.sh --impact=maximum</tspan><tspan class="cursor"> █</tspan>
    </text>

  </g>
</svg>
